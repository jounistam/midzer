name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/web/public/soundfonts
          key: soundfont-${{ hashFiles('scripts/fetch-soundfont.mjs') }}
      - run: pnpm build
      - run: pnpm test
      # ubuntu-latest ships Google Chrome, which the Playwright config uses.
      - run: pnpm e2e
