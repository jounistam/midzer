[package]
name = "midzer-stems"
description = "Stem separation (HT-Demucs) and note transcription (basic-pitch) through ONNX Runtime, for the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
midzer-analyze = { path = "../midzer-analyze" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs"] }
sha2 = "0.11"
ureq = "3"

[dev-dependencies]
serde_json = "1"
