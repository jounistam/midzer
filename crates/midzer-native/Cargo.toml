[package]
name = "midzer-native"
description = "Native host for midzer-core: cpal audio, midir MIDI and the microphone, for desktop and mobile."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
midzer-core = { path = "../midzer-core" }
midzer-synth = { path = "../midzer-synth" }
cpal = "0.18"
midir = "0.11"
crossbeam-queue = "0.3"

# PulseAudio (pure Rust, also served by PipeWire) for recording system audio through its monitor sources.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
