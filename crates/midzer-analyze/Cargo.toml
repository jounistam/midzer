[package]
name = "midzer-analyze"
description = "Offline analysis of a recording into a song: beats, chords, sections and a melody."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midzer-core = { path = "../midzer-core" }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg", "adpcm"] }

[dev-dependencies]
midzer-hear = { path = "../midzer-hear" }
midzer-synth = { path = "../midzer-synth" }
